$:
  vscode:
    - docker:
        image: docker.cnb.cool/pylover/tools/zgadmin:env
      runner:
        cpus: 8
      services:
        - docker
        - vscode
      stages:
        - name: ls
          script: ls -la

  web_trigger_one:
    - services:
        - docker
      env:
        IMAGE_TAG: docker.cnb.cool/pylover/tools/zgadmin:env
      stages:
        - name: docker build
          script: docker build -t ${IMAGE_TAG} . -f .cnb/Dockerfile
        - name: docker list
          script: docker images
        - name: docker push
          script: docker push ${IMAGE_TAG}

  tag_push:
    # 构建 Docker 镜像并推送
    - services:
        - docker
      stages:
        - name: build and push docker image
          script: bash scripts/build.sh

main:
  # ===== 每周周一 9:00 依赖版本检测 =====
  "crontab: 0 9 * * 1":
    - name: dependency-check
      docker:
        image: docker.cnb.cool/pylover/tools/zgadmin:env
      services:
        - docker
      stages:
        - name: check dependencies
          script: bash scripts/deps-check.sh

  push:
    - stages:
        - name: sync to github
          imports: https://cnb.cool/pylover/key/-/blob/main/github.yml
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/pylover7/ZgAdmin.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}
  vscode:
    - docker:
        image: docker.cnb.cool/pylover/tools/zgadmin:env
      runner:
        cpus: 8
      services:
        - docker
        - name: vscode
          options:
            onlyPreview: true
            launch: bash ./scripts/preview.sh
            daemon: true
      stages:
        - name: ls
          script: ls -la

